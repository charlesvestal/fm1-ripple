# Ripple's build settings (fm1-base's tools/build.py: ./build.sh)
name = "RIPPLE"                # the build's files: ripple.fwsc, ripple-X.Y.fwsc
id_prefix = "FM-1_13"          # package identity: dev FM-1_1300, releases FM-1_13XXYYZZ
usb_manufacturer = "Ripple"
usb_product = "Ripple FM-1"
ble = false                    # not in the first version: the pool goes to Lua and the currents
usb_audio_in = true
usb_audio_out = false
cpu2 = true                    # the second core: half of each run of currents (flow.c render_run)
msc = true                     # disk mode: the FM-1 as a USB drive of its disk (disk.c)
words = "words.tsv"
font_full = ["M"]              # droplets write lower case in every size
include = ["lua", "../sdk/include", "../sdk/faust"]
web = ["build/currents-web/*.c"] # the emulator: the currents linked in (sdk/tools/currents.py --web, gen)
web_link = ["build/currents-web/*.a"]   # and its C++ currents (Plaits'), compiled by currents.py with emcc
web_cflags = ["-sSUPPORT_LONGJMP=wasm", "-Wl,--allow-undefined"]   # Lua's errors in the emulator: WebAssembly's own
                               # setjmp (no JavaScript); the page's currents: imports (flow.c rp_js_cur_*)
device_include = ["lua/libc"]          # declarations of the few C library calls Lua makes (luaport.c has them)
o2 = ["lua/lua_one.c", "midifx/mfx_one.c"]         # Lua and the droplet API, and the MIDI effects: units of their own (o2_cflags: at -Os, not the render)
o2_cflags = ["-Os"]
asm = ["lua/lj.S"]             # Lua's errors: setjmp / longjmp
vendored = ["third_party/"]
gen = ["../tools/mkdisk.py ../disk --header {gen}/disk_image.h",        # the empty disk: disk/ (its folders)
       "../tools/mkdisk.py build/builtin --builtin {gen}/builtin_image.h", # built in: builtin/ and the currents (build.sh)
       "../sdk/tools/currents.py ../currents ../currents/extra --web build/currents-web"]    # the emulator's currents, as C
# the site
tagline = "Droplets and currents for the FM-1"
repo = "https://github.com/charlesvestal/fm1-ripple"
licence = "MPL-2.0"
credits = "Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments). Lua 5.4 (MIT, Lua.org, PUC-Rio). Currents in Faust (GRAME) and in Pd, compiled by hvcc (Wasted Audio, continuing Enzien Audio's Heavy)."

# firmware.json, for firmware hubs (fm1-base docs/FIRMWARE-JSON.md)
author = "Charles Vestal"
description = "Ripple turns the M-VAVE FM-1 into an instrument you can reprogram without reflashing. Droplets, small programs in Lua, are its instruments: twelve are built in, from a drum machine to generative bells, a looper and the Game of Life. Their sounds are currents, written in Faust, Pd or C, and any droplet can load them and chain them. To add your own, put the FM-1 in disk mode: it shows up on your computer as a USB drive, and you copy files onto it."
tags = ["experimental", "synth", "generative"]
install = "https://charlesvestal.github.io/fm1-ripple/install/"
site = "https://charlesvestal.github.io/fm1-ripple/"
screenshot = "app/docs/img/list.png"
